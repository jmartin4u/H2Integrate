  #     model: "iron"
  #   model_inputs:
  #     cost_parameters:
  #       # h2_kgpy: 68583942.6460997 #1000000 #68583942.6460997
  #       LCOE: 58.02 #$/MWh
  #       LCOH: 7.10 #$/kg
  #       ROM_iron_site_name: "Hibbing" #"Hibbing", "Northshore", "United", "Minorca" or "Tilden"
  #       iron_ore_product_selection: "drg_taconite_pellets" #"drg_taconite_pellets" or "std_taconite_pellets"
  #       reduced_iron_product_selection: "h2_dri" #"h2_dri" or "ng_dri"
  #       structural_iron_product_selection: "eaf_steel" #"eaf_steel" or "none"
  #       structural_iron_product_selection: "none" #"eaf_steel" or "none"
